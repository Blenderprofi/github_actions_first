name: CI

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_NAME: ${{ github.repository }}

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  app_check:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: App check
        run: |
          pip --version
          python --version
          python -m py_compile app.py
          pip install --no-cache-dir -r requirements.txt
          python -c "import flask, psycopg2, redis; print('imports are okay!')"
  build_push:
    needs: app_check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Repo checkout
        uses: actions/checkout@v4
      - name: Normalize image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: docker login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login $REGISTRY -u ${{ github.actor }} --password-stdin
      - name: Image info
        run: |
          echo "Image registry: $REGISTRY"
          echo "Image tag: $IMAGE_TAG"
          echo "Image name: $IMAGE_NAME"
      - name: docker build
        run: |
          docker build -t "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG" .
      - name: docker push
        run: |
          docker push "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
      - name: artifacts
        run: |
          mkdir -p artifacts
          echo "Registry: $REGISTRY" > artifacts/image_info.txt
          echo "Image name: $IMAGE_NAME" >> artifacts/image_info.txt
          echo "Image tag: $IMAGE_TAG" >> artifacts/image_info.txt
          echo "Docker version: $(docker --version)" > artifacts/docker_info.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image_info
          path: artifacts/

